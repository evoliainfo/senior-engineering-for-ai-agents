name: Semantic Routing v2 provider stability

on:
  pull_request:
    branches: [main]
    paths:
      - "semantic_v2/stabilized_extractor.py"
      - "semantic_v2/__init__.py"
      - "evals/run_semantic_v2_provider_stability.py"
      - "evals/run_semantic_v2_s5_stability.py"
      - ".github/workflows/semantic-v2-provider-stability.yml"
      - ".github/workflows/semantic-v2-s5.yml"
      - "docs/SEMANTIC_ROUTING_V2_PROVIDER_STABILITY.md"
      - "docs/SEMANTIC_ROUTING_V2_BUILD_PLAN.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-v2-provider-stability-deterministic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove frozen v1.5 runtime is untouched
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS
          test "$(sha256sum sef.py | awk '{print $1}')" = "c2203602cb53229aba55bbbb518725c155785838915e75267714bc4e2d3d35ee"
          git fetch origin main
          git diff --exit-code origin/main...HEAD -- sef.py SHA256SUMS

      - name: Compile S0-S5R implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            semantic_v2/__init__.py \
            semantic_v2/contracts.py \
            semantic_v2/bridge_v15.py \
            semantic_v2/model_extractor.py \
            semantic_v2/openai_responses_provider.py \
            semantic_v2/policy_composer.py \
            semantic_v2/shadow_integration.py \
            semantic_v2/stabilized_extractor.py \
            evals/run_semantic_v2_s0_s1.py \
            evals/run_semantic_v2_s2.py \
            evals/run_semantic_v2_s3.py \
            evals/run_semantic_v2_s4.py \
            evals/run_semantic_v2_s5.py \
            evals/run_semantic_v2_provider_stability.py \
            evals/run_semantic_v2_s5_stability.py
          python3 -m json.tool evals/semantic_v2/s5_corpus.json >/dev/null

      - name: Re-run S0-S1 contracts
        run: PYTHONPATH=. python3 evals/run_semantic_v2_s0_s1.py --output semantic-v2-s0-s1.json

      - name: Re-run S2 provider boundary
        run: PYTHONPATH=. python3 evals/run_semantic_v2_s2.py --output semantic-v2-s2.json

      - name: Re-run S3 deterministic composer
        run: PYTHONPATH=. python3 evals/run_semantic_v2_s3.py --output semantic-v2-s3.json

      - name: Re-run S4 shadow integration
        run: PYTHONPATH=. python3 evals/run_semantic_v2_s4.py --output semantic-v2-s4.json

      - name: Re-run unchanged S5 replay contract
        run: PYTHONPATH=. python3 evals/run_semantic_v2_s5.py --provider replay --output semantic-v2-s5-replay.json

      - name: Run S5R stability controls
        run: PYTHONPATH=. python3 evals/run_semantic_v2_provider_stability.py

      - name: Run unchanged S5 corpus through stabilized replay
        run: PYTHONPATH=. python3 evals/run_semantic_v2_s5_stability.py --provider replay --output semantic-v2-s5r-replay.json

      - name: Publish deterministic stability evidence
        uses: actions/upload-artifact@v4
        with:
          name: semantic-v2-provider-stability-${{ github.run_id }}
          path: |
            semantic-v2-s0-s1.json
            semantic-v2-s2.json
            semantic-v2-s3.json
            semantic-v2-s4.json
            semantic-v2-s5-replay.json
            semantic-v2-provider-stability.json
            semantic-v2-s5r-replay.json
          retention-days: 90

  semantic-v2-provider-stability-openai:
    runs-on: ubuntu-24.04
    needs: semantic-v2-provider-stability-deterministic
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5.6
      OPENAI_REASONING_EFFORT: medium
    steps:
      - uses: actions/checkout@v4

      - name: Record explicit NOT_RUN when credential is unavailable
        if: ${{ env.OPENAI_API_KEY == '' }}
        run: |
          PYTHONPATH=. python3 evals/run_semantic_v2_s5_stability.py \
            --provider not-run \
            --output semantic-v2-s5r-openai.json

      - name: Run one bounded live S5R qualification
        if: ${{ env.OPENAI_API_KEY != '' }}
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 evals/run_semantic_v2_s5_stability.py \
            --provider openai \
            --model "${OPENAI_MODEL}" \
            --reasoning-effort "${OPENAI_REASONING_EFFORT}" \
            --output semantic-v2-s5r-openai.json

      - name: Publish live stability evidence or NOT_RUN record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-v2-s5r-openai-${{ github.run_id }}
          path: semantic-v2-s5r-openai.json
          if-no-files-found: warn
          retention-days: 90
