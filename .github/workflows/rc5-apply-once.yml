name: RC-5 apply runtime patch once
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feat/rc5-observable-requirements'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rc5-observable-requirements
      - run: python3 tools/apply_rc5_observable_requirements.py
      - run: |
          python3 -m py_compile sef.py
          python3 sef.py self-test
          sha256sum -c SHA256SUMS
      - run: |
          git config user.name 'SEF CI'
          git config user.email 'actions@users.noreply.github.com'
          git add sef.py SHA256SUMS
          git commit -m 'feat: integrate RC-5 observable requirements' || exit 0
          git push origin HEAD:feat/rc5-observable-requirements
