name: RC-7 apply runtime patch once
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feat/rc7-explicit-waiver-semantics'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rc7-explicit-waiver-semantics
      - run: python3 tools/apply_rc7_waiver_and_cleanup.py
      - run: |
          python3 -m py_compile sef.py
          python3 sef.py self-test
          sha256sum -c SHA256SUMS
      - run: |
          git config user.name 'SEF CI'
          git config user.email 'actions@users.noreply.github.com'
          git add sef.py SHA256SUMS
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: integrate RC-7 explicit waiver semantics'
          git push origin HEAD:feat/rc7-explicit-waiver-semantics
