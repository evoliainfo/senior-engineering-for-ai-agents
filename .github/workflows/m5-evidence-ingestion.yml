name: M5 Evidence Ingestion gate

on:
  pull_request:
    paths:
      - "delivery_missions/**"
      - "expert_packs/**"
      - "project_state/**"
      - "tool_capabilities/**"
      - "evals/run_launch_production_web_product_m5.py"
      - "evals/run_m5_evidence_ingestion.py"
      - "docs/LAUNCH_PRODUCTION_WEB_PRODUCT_M5.md"
      - "docs/M5_EVIDENCE_INGESTION_AND_STATE_ADVANCEMENT.md"
      - ".github/workflows/m5-evidence-ingestion.yml"
      - "sef.py"
      - "SHA256SUMS"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m5-evidence-ingestion:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preserve deterministic beta runtime integrity
        run: sha256sum -c SHA256SUMS

      - name: Compile M5 orchestration and evidence surfaces
        run: |
          python3 -m py_compile \
            delivery_missions/__init__.py \
            delivery_missions/launch_production_web_product/__init__.py \
            delivery_missions/launch_production_web_product/core.py \
            delivery_missions/launch_production_web_product/evidence.py \
            evals/run_launch_production_web_product_m5.py \
            evals/run_m5_evidence_ingestion.py

      - name: Validate M5 JSON contracts
        run: |
          python3 -m json.tool delivery_missions/launch_production_web_product/mission.schema.json >/dev/null
          python3 -m json.tool delivery_missions/launch_production_web_product/execution-result.schema.json >/dev/null
          python3 -m json.tool delivery_missions/launch_production_web_product/evidence-receipt.schema.json >/dev/null

      - name: Validate public evidence API
        run: |
          python3 - <<'PY'
          from delivery_missions import (
              advance_from_execution,
              decide_next_action,
              evaluate_execution_result,
              seal_execution_result,
              validate_evidence_receipt,
              validate_execution_result,
          )
          assert all(callable(fn) for fn in (
              advance_from_execution,
              decide_next_action,
              evaluate_execution_result,
              seal_execution_result,
              validate_evidence_receipt,
              validate_execution_result,
          ))
          PY

      - name: Preserve first M5 orchestration qualification
        run: python3 evals/run_launch_production_web_product_m5.py

      - name: Run deterministic M5 evidence qualification
        run: python3 evals/run_m5_evidence_ingestion.py

      - name: Publish M5 evidence qualification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m5-evidence-ingestion-${{ github.run_id }}
          path: |
            eval-results/launch-production-web-product-m5-report.json
            eval-results/m5-evidence-ingestion-report.json
          if-no-files-found: error
