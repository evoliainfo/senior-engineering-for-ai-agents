name: Full DEV closure measurement
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-dev-closure:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'eval/dev-closure-full-catalog'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate harness and execute all 38 DEV contracts
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS
          python3 -m py_compile sef.py evals/run.py evals/run_evidence_release.py evals/run_dev_closure_extra.py evals/run_dev_closure_state.py evals/run_dev_closure_all.py
          python3 evals/run.py validate --scenarios evals/scenarios/dev
          python3 evals/run_evidence_release.py validate
          set +e
          python3 evals/run_dev_closure_all.py --output dev-closure-all.json
          benchmark_exit=$?
          set -e
          python3 - "$benchmark_exit" <<'PY'
          import json,sys
          r=json.load(open('dev-closure-all.json'))
          print(json.dumps({k:r[k] for k in ('accounting','harness_integrity','harness_errors','benchmark','known_l2_followups')},indent=2))
          if r.get('challenge_status')!='SEALED' or r.get('challenge_ids_executed'):
              raise SystemExit('CHALLENGE process boundary violated')
          if r.get('harness_integrity')!='PASS':
              raise SystemExit('Invalid DEV closure measurement: '+str(r.get('harness_errors')))
          if int(sys.argv[1]) not in (0,1):
              raise SystemExit(f'Unexpected orchestrator exit code {sys.argv[1]}')
          print('Benchmark FAIL remains visible as measurement data and does not invalidate this harness-only PR.')
          PY
      - name: Publish full DEV closure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-dev-closure-${{ github.run_id }}
          path: dev-closure-all.json
          if-no-files-found: error
          retention-days: 90
