name: Full DEV regression gate
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-dev-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate harness and require all 38 DEV contracts
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS
          python3 -m py_compile sef.py evals/run.py evals/run_evidence_release.py evals/run_dev_closure_evidence.py evals/run_dev_closure_extra.py evals/run_dev_closure_state.py evals/run_dev_closure_all.py
          python3 evals/run.py validate --scenarios evals/scenarios/dev
          python3 evals/run_evidence_release.py validate
          python3 evals/run_dev_closure_all.py --output dev-closure-all.json
          python3 - <<'PY'
          import json
          r=json.load(open('dev-closure-all.json'))
          print(json.dumps({k:r[k] for k in ('accounting','harness_integrity','harness_errors','benchmark','known_l2_followups')},indent=2))
          if r.get('challenge_status')!='SEALED' or r.get('challenge_ids_executed'):
              raise SystemExit('CHALLENGE process boundary violated')
          if r.get('harness_integrity')!='PASS':
              raise SystemExit('Invalid DEV closure measurement: '+str(r.get('harness_errors')))
          a=r.get('accounting',{})
          if not (a.get('expected_dev')==38 and a.get('observed_dev')==38 and a.get('unique_observed')==38 and not a.get('missing') and not a.get('unexpected') and not a.get('duplicates')):
              raise SystemExit('DEV accounting is not exact: '+str(a))
          b=r.get('benchmark',{})
          if b.get('status')!='PASS' or b.get('counts',{}).get('PASS')!=38 or b.get('failures') or b.get('critical_failures'):
              raise SystemExit('Full deterministic DEV regression gate failed: '+str(b))
          PY
      - name: Publish full DEV closure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-dev-closure-${{ github.run_id }}
          path: dev-closure-all.json
          if-no-files-found: error
          retention-days: 90
