name: M5 Agent Native Live Loop gate

on:
  pull_request:
    paths:
      - 'delivery_missions/**'
      - 'tools/delivery_mission.py'
      - 'evals/run_m5_agent_native_live_loop.py'
      - '.github/workflows/m5-agent-native-live-loop.yml'
      - 'project_state/**'
      - 'jit_expertise/**'
      - 'expert_packs/**'
      - 'tool_capabilities/**'
      - 'sef.py'
      - 'SHA256SUMS'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m5-agent-native-live-loop:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preserve deterministic beta runtime integrity
        run: sha256sum -c SHA256SUMS

      - name: Compile M5 agent-native surfaces
        run: |
          python3 -m py_compile \
            delivery_missions/launch_production_web_product/agent_native.py \
            tools/delivery_mission.py \
            evals/run_m5_agent_native_live_loop.py

      - name: Validate agent-native run schema
        run: python3 -m json.tool delivery_missions/launch_production_web_product/agent-run.schema.json >/dev/null

      - name: Preserve M5 orchestration qualification
        run: python3 evals/run_launch_production_web_product_m5.py

      - name: Preserve M5 evidence-ingestion qualification
        run: python3 evals/run_m5_evidence_ingestion.py

      - name: Preserve M5 evidence-scope qualification
        run: python3 evals/run_m5_evidence_scope.py

      - name: Preserve M5 Codex execution-plan qualification
        run: python3 evals/run_m5_codex_execution_plan.py

      - name: Run agent-native process-boundary qualification
        run: python3 evals/run_m5_agent_native_live_loop.py

      - name: Publish M5 agent-native qualification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m5-agent-native-live-loop-${{ github.run_id }}
          path: |
            eval-results/launch-production-web-product-m5-report.json
            eval-results/m5-evidence-ingestion-report.json
            eval-results/m5-evidence-scope-report.json
            eval-results/m5-codex-execution-plan-report.json
            eval-results/m5-agent-native-live-loop-report.json
          if-no-files-found: error
