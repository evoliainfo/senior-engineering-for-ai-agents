name: B1 canonical promotion
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  promote-b1:
    if: github.event.pull_request.head.ref == 'integration/b1-semantic-materiality'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Verify frozen pre-promotion runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum sef.py | awk '{print $1}')" = "c5fdbcf6a1a8428663c25e15247c481c1268849a2c747de8766bc0946544d6b4"
          sha256sum -c SHA256SUMS
      - name: Rebuild exact validated B1 candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 evals/apply_b1_semantic_materiality_v3.py --input sef.py --output /tmp/b1-sef.py
          python3 -m py_compile /tmp/b1-sef.py
          test "$(sha256sum /tmp/b1-sef.py | awk '{print $1}')" = "a32437274e4617da28626c027f4162328d2ea0ded831366db1677bd815360cc3"
      - name: Re-run promotion gates on exact candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 evals/run_dev_closure_all.py --sef /tmp/b1-sef.py --output /tmp/b1-promote-dev.json
          python3 evals/run_b1_acceptance.py --sef /tmp/b1-sef.py --output /tmp/b1-promote-acceptance.json
      - name: Promote candidate and update canonical checksum
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/b1-sef.py sef.py
          printf '%s  sef.py\n' 'a32437274e4617da28626c027f4162328d2ea0ded831366db1677bd815360cc3' > SHA256SUMS
          sha256sum -c SHA256SUMS
          python3 -m py_compile sef.py
      - name: Commit exact promoted runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sef.py SHA256SUMS
          git diff --cached --quiet && exit 0
          git commit -m 'feat: promote validated B1 semantic materiality runtime'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
