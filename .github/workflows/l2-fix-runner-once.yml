name: L2 runner one-shot fix
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.pull_request.head.ref == 'eval/l2-brownfield-harness'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: eval/l2-brownfield-harness
      - name: Apply exact Python literal correction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('evals/run_l2_brownfield.py')
          s=p.read_text(encoding='utf-8')
          old='"scoring": false'
          new='"scoring": False'
          if old not in s:
              print('literal already corrected; no edit required')
          else:
              if s.count(old) != 1:
                  raise SystemExit(f'unexpected correction count: {s.count(old)}')
              p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          python3 -m py_compile evals/run_l2_brownfield.py
      - name: Commit only when changed
        run: |
          git config user.name 'SEF CI'
          git config user.email 'actions@users.noreply.github.com'
          git add evals/run_l2_brownfield.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: use Python boolean in L2 trace metadata'
          git push origin HEAD:eval/l2-brownfield-harness
