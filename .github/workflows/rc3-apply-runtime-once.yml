name: Apply RC-3 runtime patch once
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feat/rc3-task-materiality-runtime'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rc3-task-materiality-runtime
      - name: Apply validated RC-3 patch
        run: |
          set -euo pipefail
          python3 tools/apply_rc3_runtime_patch.py
          python3 -m py_compile sef.py
          sha256sum -c SHA256SUMS
          python3 sef.py self-test
      - name: Commit canonical runtime integration
        run: |
          set -euo pipefail
          if git diff --quiet -- sef.py SHA256SUMS; then exit 0; fi
          git config user.name 'SEF CI'
          git config user.email 'actions@users.noreply.github.com'
          git add sef.py SHA256SUMS
          git commit -m 'feat: integrate RC-3 task-materiality projection'
          git push origin HEAD:feat/rc3-task-materiality-runtime
