name: RC-1 single-file integration preview

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc1-single-file-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact tested revision
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          target_sha="${PR_HEAD_SHA:-$GITHUB_SHA}"
          git fetch --depth=1 origin "$target_sha"
          git checkout --detach FETCH_HEAD
          printf 'tested_head=%s\n' "$target_sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Generate integrated single-file runtime
        run: |
          set -euo pipefail
          mkdir -p artifacts/rc1-single-file
          python3 tools/build_rc1_integrated_sef.py --input sef.py --output artifacts/rc1-single-file/sef.py
          python3 -m py_compile artifacts/rc1-single-file/sef.py
          python3 artifacts/rc1-single-file/sef.py self-test
          sha256sum artifacts/rc1-single-file/sef.py > artifacts/rc1-single-file/SHA256SUMS.preview

      - name: Compare integrated runtime with validated candidate
        shell: bash
        run: |
          set -euo pipefail
          root=artifacts/rc1-single-file
          run_measurement() {
            local output="$1"; shift
            set +e
            "$@" > "$output"
            local code=$?
            set -e
            printf '%s\n' "$code" > "${output%.json}.exit-code"
          }

          run_measurement "$root/official-integrated.json" \
            python3 evals/run.py run --sef "$root/sef.py" --scenarios evals/scenarios/dev --fixtures evals/fixtures --set DEV
          run_measurement "$root/official-candidate.json" \
            python3 evals/run.py run --sef sef_rc1_candidate.py --scenarios evals/scenarios/dev --fixtures evals/fixtures --set DEV

          run_measurement "$root/negative-integrated.json" \
            python3 evals/run.py run --sef "$root/sef.py" --scenarios evals/rc1_candidate/negative_controls --fixtures evals/fixtures --set DEV
          run_measurement "$root/negative-candidate.json" \
            python3 evals/run.py run --sef sef_rc1_candidate.py --scenarios evals/rc1_candidate/negative_controls --fixtures evals/fixtures --set DEV

          run_measurement "$root/metamorphic-integrated.json" \
            python3 evals/run.py run --sef "$root/sef.py" --scenarios evals/rc1_candidate/metamorphic --fixtures evals/fixtures --set DEV
          run_measurement "$root/metamorphic-candidate.json" \
            python3 evals/run.py run --sef sef_rc1_candidate.py --scenarios evals/rc1_candidate/metamorphic --fixtures evals/fixtures --set DEV

          run_measurement "$root/probes-integrated.json" \
            python3 evals/run.py run --sef "$root/sef.py" --scenarios evals/probes/root_cause/routing --fixtures evals/fixtures --set DEV
          run_measurement "$root/probes-candidate.json" \
            python3 evals/run.py run --sef sef_rc1_candidate.py --scenarios evals/probes/root_cause/routing --fixtures evals/fixtures --set DEV

          run_measurement "$root/evidence-integrated.json" \
            python3 evals/run_evidence_release.py run --sef "$root/sef.py" --set DEV
          run_measurement "$root/evidence-candidate.json" \
            python3 evals/run_evidence_release.py run --sef sef_rc1_candidate.py --set DEV

      - name: Enforce behavioral equivalence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('artifacts/rc1-single-file')
          failures=[]
          families=['official','negative','metamorphic','probes','evidence']
          summary={}
          for family in families:
              integrated=json.loads((root/f'{family}-integrated.json').read_text())
              candidate=json.loads((root/f'{family}-candidate.json').read_text())
              irows={str(x.get('scenario_id')):x for x in integrated.get('results',[])}
              crows={str(x.get('scenario_id')):x for x in candidate.get('results',[])}
              if set(irows)!=set(crows): failures.append(f'{family}: scenario sets differ')
              for sid in sorted(set(irows)&set(crows)):
                  if irows[sid].get('status')!=crows[sid].get('status'):
                      failures.append(f'{family}:{sid}: {crows[sid].get("status")} candidate != {irows[sid].get("status")} integrated')
              if any(x.get('status')=='HARNESS_ERROR' for x in integrated.get('results',[])):
                  failures.append(f'{family}: integrated HARNESS_ERROR')
              summary[family]={
                  'candidate': candidate.get('summary',{}).get('counts',{}),
                  'integrated': integrated.get('summary',{}).get('counts',{}),
              }
          summary['equivalence_gate']='FAIL' if failures else 'PASS'
          summary['failures']=failures
          (root/'equivalence-summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,indent=2,sort_keys=True))
          if failures: raise SystemExit('\n'.join(failures))
          PY

      - name: Publish single-file preview evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc1-single-file-preview-${{ github.run_id }}
          path: artifacts/rc1-single-file/
          if-no-files-found: error
          retention-days: 90
