name: M5 Codex Execution Plan gate

on:
  pull_request:
    paths:
      - "delivery_missions/**"
      - "jit_expertise/**"
      - "expert_packs/**"
      - "project_state/**"
      - "tool_capabilities/**"
      - "evals/run_launch_production_web_product_m5.py"
      - "evals/run_m5_evidence_ingestion.py"
      - "evals/run_m5_evidence_scope.py"
      - "evals/run_m5_codex_execution_plan.py"
      - "docs/LAUNCH_PRODUCTION_WEB_PRODUCT_M5.md"
      - "docs/M5_EVIDENCE_INGESTION_AND_STATE_ADVANCEMENT.md"
      - "docs/M5_CODEX_EXECUTION_HANDOFF.md"
      - ".github/workflows/m5-codex-execution-plan.yml"
      - "sef.py"
      - "SHA256SUMS"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m5-codex-execution-plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preserve deterministic beta runtime integrity
        run: sha256sum -c SHA256SUMS

      - name: Compile M5 handoff surfaces
        run: |
          python3 -m py_compile \
            delivery_missions/__init__.py \
            delivery_missions/launch_production_web_product/__init__.py \
            delivery_missions/launch_production_web_product/core.py \
            delivery_missions/launch_production_web_product/evidence.py \
            delivery_missions/launch_production_web_product/execution_plan.py \
            evals/run_launch_production_web_product_m5.py \
            evals/run_m5_evidence_ingestion.py \
            evals/run_m5_evidence_scope.py \
            evals/run_m5_codex_execution_plan.py

      - name: Validate M5 JSON contracts
        run: |
          python3 -m json.tool delivery_missions/launch_production_web_product/mission.schema.json >/dev/null
          python3 -m json.tool delivery_missions/launch_production_web_product/execution-plan.schema.json >/dev/null
          python3 -m json.tool delivery_missions/launch_production_web_product/execution-result.schema.json >/dev/null
          python3 -m json.tool delivery_missions/launch_production_web_product/evidence-receipt.schema.json >/dev/null

      - name: Validate public handoff API
        run: |
          python3 - <<'PY'
          from delivery_missions import (
              build_execution_plan,
              decide_next_action,
              validate_execution_plan,
          )
          assert all(callable(fn) for fn in (
              build_execution_plan,
              decide_next_action,
              validate_execution_plan,
          ))
          PY

      - name: Preserve first M5 orchestration qualification
        run: python3 evals/run_launch_production_web_product_m5.py

      - name: Preserve M5 evidence-ingestion qualification
        run: python3 evals/run_m5_evidence_ingestion.py

      - name: Preserve M5 evidence-scope qualification
        run: python3 evals/run_m5_evidence_scope.py

      - name: Run deterministic Codex execution-plan qualification
        run: python3 evals/run_m5_codex_execution_plan.py

      - name: Publish M5 handoff qualification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m5-codex-execution-plan-${{ github.run_id }}
          path: |
            eval-results/launch-production-web-product-m5-report.json
            eval-results/m5-evidence-ingestion-report.json
            eval-results/m5-evidence-scope-report.json
            eval-results/m5-codex-execution-plan-report.json
          if-no-files-found: error
