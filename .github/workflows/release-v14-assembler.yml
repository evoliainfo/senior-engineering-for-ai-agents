name: SEF v1.4 release assembler

on:
  pull_request:
    branches: [main]
    paths:
      - ".sef-upload-v14/manifest.json"

permissions:
  contents: write

jobs:
  assemble-v14:
    if: github.head_ref == 'release/v1.4' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout controlled release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 pinned
        with:
          ref: release/v1.4
          persist-credentials: true

      - name: Rebuild exact validated SEF v1.4 runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, io, re, subprocess, tempfile, zipfile

          OLD_SHA = "257c9b9409256eb688a64430b89b2c8dd9d8805a4c39fe96187ed415d4cfad0d"
          NEW_SHA = "31e3dfc1b1a173c83f0a85e2aad6fe4080f33899f328261aa2129a060f5ac68e"
          PATCH_SHA = "0dc608c6ca2e4bfc3a8ebe25df346f5de397a5f9b05f7d997667f689ed4206e0"
          SKILL_HASHES = {
              '.agents/skills/analytics-conversion-instrumentation/SKILL.md': '522bdf1e24a22f48b6974208e09d18c999e4832bfe4c742793a17524285174bf',
              '.agents/skills/geo-ai-discoverability-engineering/SKILL.md': '57a810507b634d5a624514134cd8cb1a811d0405795290f960c514124dd8745f',
              '.agents/skills/seo-web-discoverability-engineering/SKILL.md': 'decc9fc7735d89236717f132645c050339b4edefbd109004ed3fa1b777831398',
          }
          root = Path('.sef-upload-v14')
          runtime = Path('sef.py')
          old_bytes = runtime.read_bytes()
          if hashlib.sha256(old_bytes).hexdigest() != OLD_SHA:
              raise SystemExit('Refusing to build: sef.py is not the expected v1.3 runtime')

          patch_b64 = ''.join((root / f'outer-patch-{i:02d}.b64').read_text(encoding='ascii').strip() for i in range(4))
          patch_bytes = gzip.decompress(base64.b64decode(patch_b64, validate=True))
          if hashlib.sha256(patch_bytes).hexdigest() != PATCH_SHA:
              raise SystemExit('Outer source patch integrity mismatch')

          old_text = old_bytes.decode('utf-8')
          match = re.search(r"PAYLOAD_B64='([^']*)'", old_text)
          if not match:
              raise SystemExit('PAYLOAD_B64 not found')
          old_payload_b64 = match.group(1)
          placeholder = old_text[:match.start()] + "PAYLOAD_B64='<PAYLOAD>'" + old_text[match.end():]

          with tempfile.TemporaryDirectory() as td:
              td = Path(td)
              f = td / 'sef.py'
              f.write_text(placeholder, encoding='utf-8')
              patch = td / 'outer.patch'
              patch.write_bytes(patch_bytes)
              subprocess.run(['git', 'apply', '--unsafe-paths', str(patch)], cwd=td, check=True)
              new_outer = f.read_text(encoding='utf-8')

          with zipfile.ZipFile(io.BytesIO(base64.b64decode(old_payload_b64)), 'r') as zin:
              order = zin.namelist()
              files = {name: zin.read(name) for name in order}

          new_skills = {
              '.agents/skills/analytics-conversion-instrumentation/SKILL.md': (root / 'new-skills/analytics-conversion-instrumentation/SKILL.md').read_bytes(),
              '.agents/skills/geo-ai-discoverability-engineering/SKILL.md': (root / 'new-skills/geo-ai-discoverability-engineering/SKILL.md').read_bytes(),
              '.agents/skills/seo-web-discoverability-engineering/SKILL.md': (root / 'new-skills/seo-web-discoverability-engineering/SKILL.md').read_bytes(),
          }
          for name, data in new_skills.items():
              if hashlib.sha256(data).hexdigest() != SKILL_HASHES[name]:
                  raise SystemExit(f'Skill integrity mismatch: {name}')
              files[name] = data
              idx = 0
              while idx < len(order) and order[idx].startswith('.agents/skills/') and order[idx] < name:
                  idx += 1
              order.insert(idx, name)

          buf = io.BytesIO()
          with zipfile.ZipFile(buf, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zout:
              for name in order:
                  zi = zipfile.ZipInfo(name, date_time=(2026, 8, 21, 0, 0, 0))
                  zi.compress_type = zipfile.ZIP_DEFLATED
                  zi.create_system = 3
                  zi.external_attr = 2175008768
                  zout.writestr(zi, files[name], compress_type=zipfile.ZIP_DEFLATED, compresslevel=9)

          payload = base64.b64encode(buf.getvalue()).decode('ascii')
          marker = "PAYLOAD_B64='<PAYLOAD>'"
          if marker not in new_outer:
              raise SystemExit('Patched source payload placeholder missing')
          new_bytes = new_outer.replace(marker, "PAYLOAD_B64='" + payload + "'", 1).encode('utf-8')
          actual = hashlib.sha256(new_bytes).hexdigest()
          if actual != NEW_SHA:
              raise SystemExit(f'Exact runtime SHA mismatch: {actual} != {NEW_SHA}')
          runtime.write_bytes(new_bytes)
          Path('SHA256SUMS').write_text(f'{actual}  sef.py\n', encoding='ascii')
          print(f'Built exact SEF v1.4 runtime: {len(new_bytes)} bytes, sha256={actual}')
          PY
          python3 -m py_compile sef.py
          python3 sef.py self-test
          sha256sum -c SHA256SUMS

      - name: Publish exact runtime to release branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sef.py SHA256SUMS
          git commit -m "build: publish exact SEF v1.4 runtime"
          git push origin HEAD:release/v1.4
