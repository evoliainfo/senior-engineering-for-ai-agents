name: Normalize and persist RC-2 baseline
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  normalize:
    if: github.event.pull_request.head.ref == 'research/rc2-polarity-negation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/rc2-polarity-negation
      - run: python3 tools/normalize_rc2_scenarios.py
      - run: |
          python3 evals/run.py validate --scenarios evals/diagnostic/rc2_polarity/treatment
          python3 evals/run.py validate --scenarios evals/diagnostic/rc2_polarity/control
      - run: |
          if git diff --quiet -- evals/diagnostic/rc2_polarity; then exit 0; fi
          git config user.name 'SEF CI'
          git config user.email 'actions@users.noreply.github.com'
          git add evals/diagnostic/rc2_polarity
          git commit -m 'test: normalize RC-2 scenarios for eval harness'
          git push origin HEAD:research/rc2-polarity-negation
