name: RC-3 candidate comparison
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_rc3_candidate.py sef.py artifacts/rc3-candidate/sef_candidate.py
          python3 -m py_compile artifacts/rc3-candidate/sef_candidate.py
          python3 artifacts/rc3-candidate/sef_candidate.py self-test >/tmp/rc3-selftest.json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/rc3-selftest.json'))
          assert p.get('status')=='PASS',p
          PY

      - name: Compare canonical vs RC-3 candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/rc3-comparison/base artifacts/rc3-comparison/candidate
          run_suite () {
            local name="$1"; local scenarios="$2"; shift 2
            set +e
            python3 evals/run.py run --sef sef.py --scenarios "$scenarios" --fixtures evals/fixtures --set DEV "$@" > "artifacts/rc3-comparison/base/${name}.json"
            python3 evals/run.py run --sef artifacts/rc3-candidate/sef_candidate.py --scenarios "$scenarios" --fixtures evals/fixtures --set DEV "$@" > "artifacts/rc3-comparison/candidate/${name}.json"
            set -e
          }
          run_suite official evals/scenarios/dev
          run_suite rc3-treatment evals/diagnostic/rc3_materiality/treatment
          run_suite rc3-control evals/diagnostic/rc3_materiality/control
          run_suite rc3-ambiguity evals/diagnostic/rc3_materiality/ambiguity
          run_suite rc1-negative evals/diagnostic/rc1_preimplementation/negative_controls
          run_suite rc1-metamorphic evals/diagnostic/rc1_preimplementation/metamorphic
          run_suite rc2-treatment evals/diagnostic/rc2_polarity/treatment
          run_suite rc2-control evals/diagnostic/rc2_polarity/control

          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('artifacts/rc3-comparison')
          suites=['official','rc3-treatment','rc3-control','rc3-ambiguity','rc1-negative','rc1-metamorphic','rc2-treatment','rc2-control']
          failures=[]; lines=['# RC-3 candidate comparison','', '| Suite | Base PASS | Candidate PASS | PASS→FAIL |','| --- | ---: | ---: | ---: |']
          all_base={}; all_cand={}
          for s in suites:
            b=json.loads((root/'base'/f'{s}.json').read_text()); c=json.loads((root/'candidate'/f'{s}.json').read_text())
            bm={r['scenario_id']:r for r in b.get('results',[])}; cm={r['scenario_id']:r for r in c.get('results',[])}
            regress=[sid for sid,r in bm.items() if r.get('status')=='PASS' and cm.get(sid,{}).get('status')!='PASS']
            bpass=sum(r.get('status')=='PASS' for r in bm.values()); cpass=sum(r.get('status')=='PASS' for r in cm.values())
            lines.append(f'| `{s}` | {bpass}/{len(bm)} | {cpass}/{len(cm)} | {len(regress)} |')
            if regress: failures.append(f'{s} PASS→FAIL: {regress}')
            all_base.update(bm); all_cand.update(cm)
          # Hard RC-3 gates.
          if all_cand.get('WEB-001',{}).get('status')!='PASS': failures.append('WEB-001 must PASS in candidate')
          for sid in [f'RC3-TREAT-{i:03d}' for i in range(1,9)]:
            if all_cand.get(sid,{}).get('status')!='PASS': failures.append(f'{sid} treatment must PASS')
          for sid in [f'RC3-CTRL-{i:03d}' for i in range(1,9)]+[f'RC3-AMB-{i:03d}' for i in range(1,4)]:
            if all_cand.get(sid,{}).get('status')!='PASS': failures.append(f'{sid} safety control must remain PASS')
          # Official suite should reach complete pass if WEB-001 is the only residual failure.
          official=json.loads((root/'candidate'/'official.json').read_text())
          if official.get('summary',{}).get('counts',{}).get('PASS')!=official.get('summary',{}).get('total'):
            failures.append(f"official candidate not fully green: {official.get('summary')}")
          summary='\n'.join(lines+['',f'- Candidate gate: `{"PASS" if not failures else "FAIL"}`']+[f'- {x}' for x in failures])+'\n'
          (root/'summary.md').write_text(summary); print(summary)
          if failures: raise SystemExit('; '.join(failures))
          PY

      - name: Publish candidate comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc3-candidate-comparison-${{ github.run_id }}
          path: artifacts/rc3-comparison/
          if-no-files-found: error
          retention-days: 90
