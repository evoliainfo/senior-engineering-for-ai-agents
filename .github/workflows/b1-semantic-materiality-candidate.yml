name: B1 semantic-materiality candidate
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  b1-candidate:
    if: github.event.pull_request.head.ref == 'integration/b1-semantic-materiality'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove canonical runtime is untouched
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code "${{ github.event.pull_request.base.sha }}" -- sef.py SHA256SUMS
          sha256sum -c SHA256SUMS
          python3 -m py_compile sef.py evals/apply_b1_semantic_materiality.py evals/run_b1_acceptance.py
      - name: Build isolated B1 candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 evals/apply_b1_semantic_materiality.py --input sef.py --output /tmp/b1-sef.py | tee b1-candidate-build.txt
          python3 -m py_compile /tmp/b1-sef.py
      - name: Preserve deterministic DEV 38 of 38
        shell: bash
        run: |
          set -euo pipefail
          python3 evals/run_dev_closure_all.py --sef /tmp/b1-sef.py --output b1-dev-closure.json
      - name: Pass B1 semantic-materiality controls
        shell: bash
        run: |
          set -euo pipefail
          python3 evals/run_b1_acceptance.py --sef /tmp/b1-sef.py --output b1-acceptance.json
      - name: Publish B1 candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b1-semantic-materiality-${{ github.run_id }}
          path: |
            b1-candidate-build.txt
            b1-dev-closure.json
            b1-acceptance.json
            /tmp/b1-sef.py
          if-no-files-found: warn
          retention-days: 90
