name: Apply RC-2 canonical runtime once
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feat/rc2-polarity-negation-runtime'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rc2-polarity-negation-runtime
      - name: Apply strict canonical patch
        run: python3 tools/apply_rc2_runtime_patch.py
      - name: Validate patched runtime before commit
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS
          python3 -m py_compile sef.py
          python3 sef.py self-test
      - name: Commit canonical runtime and checksum
        run: |
          set -euo pipefail
          git config user.name 'SEF CI'
          git config user.email 'actions@users.noreply.github.com'
          git add sef.py SHA256SUMS
          git diff --cached --quiet && { echo 'No runtime patch produced'; exit 1; }
          git commit -m 'feat: integrate RC-2 clause-local polarity routing'
          git push origin HEAD:feat/rc2-polarity-negation-runtime
