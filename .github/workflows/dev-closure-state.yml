name: DEV closure stateful contracts
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stateful:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'eval/dev-closure-full-catalog'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run stateful and brownfield DEV contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile evals/run_dev_closure_state.py
          set +e
          python3 evals/run_dev_closure_state.py --output dev-closure-state.json
          code=$?
          set -e
          python3 - <<'PY'
          import json
          r=json.load(open('dev-closure-state.json'))
          print(json.dumps(r['summary'],indent=2))
          for x in r['results']:
              print(x['scenario_id'],x['status'])
              for a in x.get('assertions',[]):
                  if a.get('status')!='PASS': print(' ',a)
              for lim in x.get('limitations',[]): print(' limitation:',lim)
          PY
          exit "$code"
      - name: Publish stateful evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-closure-state-${{ github.run_id }}
          path: dev-closure-state.json
          if-no-files-found: error
          retention-days: 90
