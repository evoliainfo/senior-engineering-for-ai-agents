name: B2 canonical promotion
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  promote-b2:
    if: github.event.pull_request.head.ref == 'integration/b2-composition-closure'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Verify frozen B1 runtime before promotion
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum sef.py | awk '{print $1}')" = "a32437274e4617da28626c027f4162328d2ea0ded831366db1677bd815360cc3"
          sha256sum -c SHA256SUMS
      - name: Rebuild exact validated B2 candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 evals/apply_b2_composition.py --input sef.py --output /tmp/b2-sef.py
          python3 -m py_compile /tmp/b2-sef.py
          test "$(sha256sum /tmp/b2-sef.py | awk '{print $1}')" = "bfeda790cd70c78ceb9fae862441df35c9bfe819001c0d429c09c0dde2a0c2bd"
      - name: Re-run all B2 promotion gates
        shell: bash
        run: |
          set -euo pipefail
          python3 evals/run_dev_closure_all.py --sef /tmp/b2-sef.py --output /tmp/b2-promote-dev.json
          python3 evals/run_b1_acceptance.py --sef /tmp/b2-sef.py --output /tmp/b2-promote-b1.json
          python3 evals/run_b2_acceptance.py --sef /tmp/b2-sef.py --output /tmp/b2-promote-b2.json
          python3 evals/run_rc8_controls_round2_candidate.py --sef /tmp/b2-sef.py --output /tmp/b2-promote-rc8.json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/b2-promote-rc8.json',encoding='utf-8'))
          summary=p.get('raw_summary') or {}
          if p.get('harness_errors') or summary.get('counts') != {'PASS':14} or summary.get('status')!='PASS':
              raise SystemExit(f'RC-8 promotion gate failed: {p}')
          PY
          python3 evals/run_consumed_challenge_regression.py --sef /tmp/b2-sef.py --output /tmp/b2-promote-consumed.json
      - name: Promote exact runtime and checksum
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/b2-sef.py sef.py
          printf '%s  sef.py\n' 'bfeda790cd70c78ceb9fae862441df35c9bfe819001c0d429c09c0dde2a0c2bd' > SHA256SUMS
          sha256sum -c SHA256SUMS
          python3 -m py_compile sef.py
      - name: Commit exact promoted B2 runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sef.py SHA256SUMS
          git diff --cached --quiet && exit 0
          git commit -m 'feat: promote validated B2 composition runtime'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
