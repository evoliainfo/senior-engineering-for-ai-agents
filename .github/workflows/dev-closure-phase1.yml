name: DEV closure phase 1
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phase1:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'eval/dev-closure-full-catalog'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate and run newly materialized request scenarios
        shell: bash
        run: |
          set -euo pipefail
          python3 evals/run.py validate --scenarios evals/scenarios/dev
          python3 -m py_compile evals/run_dev_closure_extra.py
          set +e
          python3 evals/run_dev_closure_extra.py --ids REQ-001,REQ-002,REQ-003,REQ-005,AUTH-005 --output phase1.json
          code=$?
          set -e
          python3 - <<'PY'
          import json
          r=json.load(open('phase1.json'))
          print(json.dumps(r['summary'],indent=2))
          for x in r['results']:
              print(x['scenario_id'],x['status'])
              for a in x.get('assertions',[]):
                  if a.get('status')!='PASS': print(' ',a)
          PY
          exit "$code"
      - name: Publish phase-1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-closure-phase1-${{ github.run_id }}
          path: phase1.json
          if-no-files-found: error
          retention-days: 90
