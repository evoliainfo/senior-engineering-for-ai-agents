name: RC-2 routing candidate regression gate
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rc2-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Compile candidate and runtime
        run: |
          set -euo pipefail
          python3 -m py_compile sef.py evals/run.py evals/run_evidence_release.py \
            evals/diagnostic/rc2_polarity/sef_candidate.py \
            evals/diagnostic/rc2_polarity/shadow_polarity.py
          sha256sum -c SHA256SUMS

      - name: Execute canonical and candidate suites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/rc2-candidate
          run_pair() {
            name="$1"; runner="$2"; scenarios="$3"; fixtures="$4"
            set +e
            python3 "$runner" run --sef sef.py --scenarios "$scenarios" --fixtures "$fixtures" --set DEV > "artifacts/rc2-candidate/${name}-baseline.json"
            b=$?
            python3 "$runner" run --sef evals/diagnostic/rc2_polarity/sef_candidate.py --scenarios "$scenarios" --fixtures "$fixtures" --set DEV > "artifacts/rc2-candidate/${name}-candidate.json"
            c=$?
            set -e
            printf '%s\n' "$b" > "artifacts/rc2-candidate/${name}-baseline.exit"
            printf '%s\n' "$c" > "artifacts/rc2-candidate/${name}-candidate.exit"
          }

          run_pair official evals/run.py evals/scenarios/dev evals/fixtures
          run_pair rc1-negative evals/run.py evals/rc1_candidate/negative_controls evals/fixtures
          run_pair rc1-metamorphic evals/run.py evals/rc1_candidate/metamorphic evals/fixtures
          run_pair rc2-treatment evals/run.py evals/diagnostic/rc2_polarity/treatment evals/fixtures
          run_pair rc2-control evals/run.py evals/diagnostic/rc2_polarity/control evals/fixtures
          run_pair evidence evals/run_evidence_release.py evals/evidence_release/scenarios evals/evidence_release/fixtures

      - name: Enforce comparative RC-2 gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path('artifacts/rc2-candidate')
          suites=['official','rc1-negative','rc1-metamorphic','rc2-treatment','rc2-control','evidence']
          failures=[]; lines=['# RC-2 candidate comparison','', '| Suite | Baseline PASS | Candidate PASS | Regressions |','| --- | ---: | ---: | ---: |']
          reports={}
          for suite in suites:
            b=json.loads((root/f'{suite}-baseline.json').read_text())
            c=json.loads((root/f'{suite}-candidate.json').read_text())
            bm={r['scenario_id']:r for r in b.get('results',[])}
            cm={r['scenario_id']:r for r in c.get('results',[])}
            reports[suite]=(bm,cm)
            if set(bm)!=set(cm): failures.append(f'{suite}: scenario identity mismatch')
            harness=[sid for sid,r in {**bm,**cm}.items() if r.get('status')=='HARNESS_ERROR']
            if harness: failures.append(f'{suite}: HARNESS_ERROR {harness}')
            regressions=[sid for sid in bm if bm[sid].get('status')=='PASS' and cm.get(sid,{}).get('status')!='PASS']
            if regressions: failures.append(f'{suite}: PASS->FAIL regressions {regressions}')
            bp=sum(r.get('status')=='PASS' for r in bm.values()); cp=sum(r.get('status')=='PASS' for r in cm.values())
            lines.append(f'| `{suite}` | {bp} | {cp} | {len(regressions)} |')

          ob,oc=reports['official']
          if oc.get('DIFF-004',{}).get('status')!='PASS': failures.append('official: DIFF-004 must PASS under candidate')
          if sum(r.get('status')=='PASS' for r in oc.values()) <= sum(r.get('status')=='PASS' for r in ob.values()):
            failures.append('official: candidate must improve total PASS count')

          _,tc=reports['rc2-treatment']
          treatment_fail=[sid for sid,r in tc.items() if r.get('status')!='PASS']
          if treatment_fail: failures.append(f'rc2-treatment: candidate must pass all treatments {treatment_fail}')

          _,mc=reports['rc1-metamorphic']
          if any(r.get('status')!='PASS' for r in mc.values()): failures.append('rc1-metamorphic: all candidate cases must remain PASS')

          # Explicitly assert actual-diff escalation survives the request filter.
          d=oc.get('DIFF-004',{}).get('observed',{}).get('actual_diff',{})
          packs=set(d.get('packs') or []); contexts=set(d.get('execution_contexts') or [])
          required={'CONTAINER_ENGINEERING','CI_SUPPLY_CHAIN','INFRASTRUCTURE_IAC'}
          if not required.issubset(packs): failures.append(f'DIFF-004 actual diff lost required packs: {sorted(required-packs)}')
          if d.get('risk')!='R3': failures.append(f"DIFF-004 actual diff risk expected R3, got {d.get('risk')}")

          lines += ['',f"- Gate: `{'PASS' if not failures else 'FAIL'}`"]
          if failures: lines += ['', 'Failures:', *[f'- {x}' for x in failures]]
          summary='\n'.join(lines)+'\n'; (root/'summary.md').write_text(summary); print(summary)
          step=os.environ.get('GITHUB_STEP_SUMMARY')
          if step: Path(step).write_text(summary)
          if failures: raise SystemExit('; '.join(failures))
          PY

      - name: Publish candidate comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc2-candidate-comparison-${{ github.run_id }}
          path: artifacts/rc2-candidate/
          if-no-files-found: error
          retention-days: 90
