name: B2 post-B1 baseline
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  b2-baseline:
    if: github.event.pull_request.head.ref == 'integration/b2-composition-closure'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify canonical B1 identity
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS
          test "$(sha256sum sef.py | awk '{print $1}')" = "a32437274e4617da28626c027f4162328d2ea0ded831366db1677bd815360cc3"
          python3 -m py_compile sef.py evals/run_consumed_challenge_regression.py
      - name: Preserve DEV and B1 gates
        shell: bash
        run: |
          set -euo pipefail
          python3 evals/run_dev_closure_all.py --sef sef.py --output b2-post-b1-dev.json
          python3 evals/run_b1_acceptance.py --sef sef.py --output b2-post-b1-b1.json
      - name: Measure calibrated RC-8 controls after B1
        shell: bash
        run: |
          set +e
          python3 evals/run_rc8_controls_round2.py --output b2-post-b1-rc8.json
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "RC-8 harness error"
            exit 2
          fi
          echo "rc8_observation_exit=$code"
      - name: Measure consumed challenge as regression only
        shell: bash
        run: |
          set +e
          python3 evals/run_consumed_challenge_regression.py --sef sef.py --output b2-post-b1-consumed.json
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "Consumed regression harness error"
            exit 2
          fi
          echo "consumed_regression_exit=$code"
      - name: Publish post-B1 baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b2-post-b1-baseline-${{ github.run_id }}
          path: |
            b2-post-b1-dev.json
            b2-post-b1-b1.json
            b2-post-b1-rc8.json
            b2-post-b1-consumed.json
          if-no-files-found: error
          retention-days: 90
