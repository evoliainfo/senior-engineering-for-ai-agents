name: RC-6 baseline evidence provenance gate
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rc6:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate RC-6 targets
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS
          python3 -m py_compile sef.py evals/run_dev_closure_state.py evals/run_dev_closure_all.py
          python3 sef.py self-test
          python3 evals/run_dev_closure_state.py --ids EVID-005,BROWN-002 --output rc6-targets.json
          python3 - <<'PY'
          import json
          r=json.load(open('rc6-targets.json'))
          got={x['scenario_id']:x['status'] for x in r['results']}
          assert got=={'BROWN-002':'PASS','EVID-005':'PASS'}, got
          for x in r['results']:
              o=x.get('observed',{})
              c=o.get('candidate_verification',{})
              assert c.get('preexisting_failures'), (x['scenario_id'],c)
              assert 'candidate_regressions' in c and 'baseline_comparison' in c and 'residual_limitations' in c
          PY
      - name: Verify full DEV delta is bounded
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python3 evals/run_dev_closure_all.py --output rc6-full-dev.json
          code=$?
          set -e
          test "$code" -eq 1
          python3 - <<'PY'
          import json
          r=json.load(open('rc6-full-dev.json'))
          assert r['harness_integrity']=='PASS', r['harness_errors']
          assert r['accounting']['expected_dev']==38 and r['accounting']['observed_dev']==38
          assert r['challenge_status']=='SEALED' and not r['challenge_ids_executed']
          b=r['benchmark']
          assert b['counts'].get('PASS')==37, b
          assert set(b['failures'])=={'EVID-004'}, b
          assert not b['critical_failures'], b
          PY
      - name: Publish RC-6 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc6-full-dev-${{ github.run_id }}
          path: |
            rc6-targets.json
            rc6-full-dev.json
          if-no-files-found: error
          retention-days: 90
