name: RC-2 normalize scenarios once
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/rc2-polarity-negation
      - run: python3 tools/normalize_rc2_scenarios.py
      - run: |
          python3 evals/run.py validate --scenarios evals/diagnostic/rc2_polarity/treatment
          python3 evals/run.py validate --scenarios evals/diagnostic/rc2_polarity/control
      - run: |
          git config user.name 'SEF CI'
          git config user.email 'actions@users.noreply.github.com'
          git add evals/diagnostic/rc2_polarity
          git commit -m 'test: normalize RC-2 scenarios for eval harness' || exit 0
          git push origin HEAD:research/rc2-polarity-negation
