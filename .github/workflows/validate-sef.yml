name: Validate SEF runtime

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-sef-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit without third-party actions
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD

      - name: Require runtime and integrity manifest
        shell: bash
        run: |
          set -euo pipefail
          test -f sef.py
          test -f SHA256SUMS

      - name: Verify runtime checksum
        shell: bash
        run: sha256sum -c SHA256SUMS

      - name: Check Python runtime
        shell: bash
        run: python3 --version

      - name: Compile runtime and evaluation runners
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile sef.py
          python3 -m py_compile evals/run.py
          python3 -m py_compile evals/run_evidence_release.py

      - name: Run embedded SEF self-test
        shell: bash
        run: python3 sef.py self-test

      - name: Validate evaluation scenario contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 evals/run.py validate
          python3 evals/run_evidence_release.py validate

      - name: Record deterministic routing and actual-diff baseline
        shell: bash
        run: |
          set -uo pipefail
          report="$RUNNER_TEMP/sef-eval-bootstrap.json"
          set +e
          python3 evals/run.py run --set DEV > "$report"
          benchmark_exit=$?
          set -e
          cat "$report"
          python3 - "$report" "$benchmark_exit" <<'PY'
          import json, sys
          from pathlib import Path

          path, benchmark_exit = sys.argv[1], int(sys.argv[2])
          with open(path, encoding="utf-8") as handle:
              report = json.load(handle)
          results = report.get("results", [])
          expected = len(list(Path("evals/scenarios/dev").glob("*.json")))
          if len(results) != expected:
              raise SystemExit(f"Harness error: expected {expected} DEV results, got {len(results)}")
          harness_errors = [r.get("scenario_id") for r in results if r.get("status") == "HARNESS_ERROR"]
          if harness_errors:
              raise SystemExit(f"Harness error scenarios: {harness_errors}")
          print(f"Benchmark exit code: {benchmark_exit} (non-gating baseline measurement)")
          print(f"Baseline summary: {report.get('summary')}")
          PY

      - name: Record deterministic evidence and release baseline
        shell: bash
        run: |
          set -uo pipefail
          report="$RUNNER_TEMP/sef-evidence-release.json"
          set +e
          python3 evals/run_evidence_release.py run --set DEV > "$report"
          benchmark_exit=$?
          set -e
          cat "$report"
          python3 - "$report" "$benchmark_exit" <<'PY'
          import json, sys
          from pathlib import Path

          path, benchmark_exit = sys.argv[1], int(sys.argv[2])
          with open(path, encoding="utf-8") as handle:
              report = json.load(handle)
          results = report.get("results", [])
          expected = len(list(Path("evals/evidence_release/scenarios/dev").glob("*.json")))
          if len(results) != expected:
              raise SystemExit(f"Harness error: expected {expected} evidence/release DEV results, got {len(results)}")
          harness_errors = [r.get("scenario_id") for r in results if r.get("status") == "HARNESS_ERROR"]
          if harness_errors:
              raise SystemExit(f"Evidence/release harness error scenarios: {harness_errors}")
          print(f"Evidence/release benchmark exit code: {benchmark_exit} (non-gating baseline measurement)")
          print(f"Evidence/release baseline summary: {report.get('summary')}")
          PY

      - name: Validate root-cause probe contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 evals/run.py validate --scenarios evals/probes/root_cause/routing
          python3 evals/run_evidence_release.py validate --scenarios evals/probes/root_cause/evidence

      - name: Record root-cause routing probes
        shell: bash
        run: |
          set -uo pipefail
          report="$RUNNER_TEMP/sef-root-cause-routing.json"
          set +e
          python3 evals/run.py run \
            --scenarios evals/probes/root_cause/routing \
            --fixtures evals/fixtures \
            --set DEV > "$report"
          probe_exit=$?
          set -e
          cat "$report"
          python3 - "$report" "$probe_exit" <<'PY'
          import json, sys
          from pathlib import Path

          path, probe_exit = sys.argv[1], int(sys.argv[2])
          with open(path, encoding="utf-8") as handle:
              report = json.load(handle)
          results = report.get("results", [])
          expected = len(list(Path("evals/probes/root_cause/routing").glob("*.json")))
          if len(results) != expected:
              raise SystemExit(f"Probe harness error: expected {expected} routing results, got {len(results)}")
          harness_errors = [r.get("scenario_id") for r in results if r.get("status") == "HARNESS_ERROR"]
          if harness_errors:
              raise SystemExit(f"Root-cause routing harness errors: {harness_errors}")
          print(f"Root-cause routing exit code: {probe_exit} (non-gating diagnostic measurement)")
          print(f"Root-cause routing summary: {report.get('summary')}")
          PY

      - name: Record root-cause evidence probes
        shell: bash
        run: |
          set -uo pipefail
          report="$RUNNER_TEMP/sef-root-cause-evidence.json"
          set +e
          python3 evals/run_evidence_release.py run \
            --scenarios evals/probes/root_cause/evidence \
            --fixtures evals/evidence_release/fixtures \
            --set DEV > "$report"
          probe_exit=$?
          set -e
          cat "$report"
          python3 - "$report" "$probe_exit" <<'PY'
          import json, sys
          from pathlib import Path

          path, probe_exit = sys.argv[1], int(sys.argv[2])
          with open(path, encoding="utf-8") as handle:
              report = json.load(handle)
          results = report.get("results", [])
          expected = len(list(Path("evals/probes/root_cause/evidence").glob("*.json")))
          if len(results) != expected:
              raise SystemExit(f"Probe harness error: expected {expected} evidence results, got {len(results)}")
          harness_errors = [r.get("scenario_id") for r in results if r.get("status") == "HARNESS_ERROR"]
          if harness_errors:
              raise SystemExit(f"Root-cause evidence harness errors: {harness_errors}")
          print(f"Root-cause evidence exit code: {probe_exit} (non-gating diagnostic measurement)")
          print(f"Root-cause evidence summary: {report.get('summary')}")
          PY
