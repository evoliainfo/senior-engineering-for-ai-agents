name: Validate SEF runtime

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-sef-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit without third-party actions
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD

      - name: Require runtime and integrity manifest
        shell: bash
        run: |
          set -euo pipefail
          test -f sef.py
          test -f SHA256SUMS

      - name: Verify runtime checksum
        shell: bash
        run: sha256sum -c SHA256SUMS

      - name: Check Python runtime
        shell: bash
        run: python3 --version

      - name: Compile runtime and evaluation runner
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile sef.py
          python3 -m py_compile evals/run.py

      - name: Run embedded SEF self-test
        shell: bash
        run: python3 sef.py self-test

      - name: Validate evaluation scenario contracts
        shell: bash
        run: python3 evals/run.py validate

      - name: Run deterministic evaluation bootstrap scenarios
        shell: bash
        run: python3 evals/run.py self-test --ids PROP-001,AUTH-001,DATA-002,WEB-001
