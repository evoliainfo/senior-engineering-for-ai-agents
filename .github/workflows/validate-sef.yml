name: Validate SEF runtime

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-sef-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit without third-party actions
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD

      - name: Require runtime and integrity manifest
        shell: bash
        run: |
          set -euo pipefail
          test -f sef.py
          test -f SHA256SUMS

      - name: Verify runtime checksum
        shell: bash
        run: sha256sum -c SHA256SUMS

      - name: Check Python runtime
        shell: bash
        run: python3 --version

      - name: Compile runtime and evaluation runner
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile sef.py
          python3 -m py_compile evals/run.py

      - name: Run embedded SEF self-test
        shell: bash
        run: python3 sef.py self-test

      - name: Validate evaluation scenario contracts
        shell: bash
        run: python3 evals/run.py validate

      - name: Record deterministic evaluation baseline without gating harness health
        shell: bash
        run: |
          set -uo pipefail
          report="$RUNNER_TEMP/sef-eval-bootstrap.json"
          set +e
          python3 evals/run.py run --ids PROP-001,AUTH-001,DATA-002,WEB-001 > "$report"
          benchmark_exit=$?
          set -e
          cat "$report"
          python3 - "$report" "$benchmark_exit" <<'PY'
          import json, sys
          path, benchmark_exit = sys.argv[1], int(sys.argv[2])
          with open(path, encoding="utf-8") as handle:
              report = json.load(handle)
          results = report.get("results", [])
          if len(results) != 4:
              raise SystemExit(f"Harness error: expected 4 results, got {len(results)}")
          harness_errors = [r.get("scenario_id") for r in results if r.get("status") == "HARNESS_ERROR"]
          if harness_errors:
              raise SystemExit(f"Harness error scenarios: {harness_errors}")
          print(f"Benchmark exit code: {benchmark_exit} (non-gating baseline measurement)")
          print(f"Baseline summary: {report.get('summary')}")
          PY
