name: Apply RC-4 runtime integration patch
on:
  push:
    branches: [integration/rc4-evidence-release]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deterministic patch
        run: python3 tools/apply_rc4_runtime_patch.py
      - name: Syntax gate
        run: python3 -m py_compile sef.py
      - name: RC-4 helper smoke gate
        run: |
          python3 - <<'PY'
          import importlib.util
          spec=importlib.util.spec_from_file_location('sef_runtime','sef.py')
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          assert m._rc4_normalize_evidence_state(0)=="PASS"
          assert m._rc4_normalize_evidence_state(2)=="FAIL"
          assert m._rc4_normalize_evidence_state(2,"UNAVAILABLE")=="UNAVAILABLE"
          idx={"r1":{"regression":{"required":True,"seen_states":["PASS","FAIL"],"observation_count":3}}}
          assert m._rc4_aggregate_index(idx,"r1")["state"]=="FLAKY"
          assert m._rc4_aggregate_index(idx,"r2")["state"]=="NOT_RUN"
          print('RC-4 helper smoke gate PASS')
          PY
      - name: Remove one-shot patch machinery
        run: rm -f tools/apply_rc4_runtime_patch.py .github/workflows/rc4-apply-runtime-patch.yml
      - name: Commit runtime integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sef.py tools/apply_rc4_runtime_patch.py .github/workflows/rc4-apply-runtime-patch.yml
          git commit -m "feat: integrate RC-4 revision-scoped verification evidence"
          git push origin HEAD:integration/rc4-evidence-release
